[package]
name = "pa-web"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local visual web UI for Personal Agent"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
