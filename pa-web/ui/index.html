<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personal Agent</title>
<style>
  :root {
    --bg: #0e1210;
    --bg-2: #121714;
    --surface: #171d19;
    --surface-2: #1d2420;
    --card: #111613;
    --line: #2a332d;
    --line-soft: #222a25;
    --ink: #e9e5da;
    --muted: #98a29a;
    --muted-2: #6f7a72;
    --accent: #7cc4a8;
    --accent-strong: #a5e3c8;
    --accent-ink: #0d1a14;
    --warm: #e0a36a;
    --danger: #e08a86;
    --shadow: 0 20px 60px rgba(0, 0, 0, .35);
    --mono: "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--sans);
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(124, 196, 168, .12), transparent 60%),
      radial-gradient(700px 420px at 92% 8%, rgba(224, 163, 106, .08), transparent 55%),
      linear-gradient(180deg, #0d110f 0%, var(--bg) 55%, #0b0f0d 100%);
    overflow: hidden;
  }

  .app {
    width: min(1120px, 100%);
    height: 100dvh;
    margin: 0 auto;
    padding: 18px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .top {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 12px 16px;
    background: color-mix(in srgb, var(--surface) 86%, transparent);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
  }

  .brand { display: flex; align-items: center; gap: 12px; min-width: 210px; }
  .mark {
    width: 38px; height: 38px; border-radius: 12px;
    display: grid; place-items: center;
    font-family: var(--serif); font-size: 20px; font-weight: 700;
    color: var(--accent-ink);
    background: linear-gradient(135deg, var(--accent-strong), var(--accent));
    box-shadow: 0 8px 24px rgba(124, 196, 168, .25);
  }
  .brand .name { font-family: var(--serif); font-size: 17px; letter-spacing: .02em; }
  .brand .sub { font-size: 11px; color: var(--muted-2); margin-top: 2px; letter-spacing: .08em; }

  .project { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .project label { font-size: 12px; color: var(--muted-2); white-space: nowrap; }
  .project input {
    width: 100%; min-width: 0;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    outline: none;
  }
  .project input:focus { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }

  .actions { display: flex; align-items: center; gap: 10px; }
  .status {
    font-size: 12px; color: var(--muted); white-space: nowrap;
    padding: 6px 10px; border-radius: 999px;
    border: 1px solid var(--line-soft); background: var(--card);
  }
  .status[data-tone="busy"] { color: var(--warm); border-color: rgba(224, 163, 106, .25); }
  .status[data-tone="ok"] { color: var(--accent); border-color: rgba(124, 196, 168, .25); }
  .status[data-tone="error"] { color: var(--danger); border-color: rgba(224, 138, 134, .3); }

  button {
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    border-radius: 10px;
    padding: 9px 13px;
    font-family: var(--sans);
    font-size: 13px;
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  button:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #newChat { background: transparent; }

  .chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 6px 2px 10px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: #2a332d; border-radius: 999px; }

  .empty {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 16px;
    padding: 40px 16px;
  }
  .empty h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 600;
    letter-spacing: .02em;
  }
  .empty p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.8; max-width: 520px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
  .chip {
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 70%, transparent);
    color: var(--muted);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .chip:hover { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }

  .msg { display: flex; gap: 12px; margin: 0 0 18px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; flex: 0 0 30px;
    border-radius: 10px;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700;
    color: var(--muted);
    border: 1px solid var(--line);
    background: var(--card);
  }
  .msg.assistant .avatar { color: var(--accent-ink); background: linear-gradient(135deg, var(--accent-strong), var(--accent)); border: 0; }
  .bubble {
    max-width: min(780px, 82%);
    padding: 13px 15px;
    border-radius: 16px 16px 16px 5px;
    background: var(--surface);
    border: 1px solid var(--line);
    line-height: 1.75;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    border-radius: 16px 16px 5px 16px;
    background: color-mix(in srgb, var(--accent) 12%, var(--surface));
    border-color: color-mix(in srgb, var(--accent) 25%, var(--line));
  }
  .meta { margin-top: 7px; font-size: 11px; color: var(--muted-2); display: flex; gap: 10px; flex-wrap: wrap; }
  .typing { color: var(--muted); font-size: 13px; }

  .reasoning {
    margin-top: 10px;
    border: 1px solid var(--line-soft);
    background: var(--card);
    border-radius: 12px;
    padding: 9px 11px;
  }
  .reasoning summary { cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; }
  .reasoning pre {
    margin: 9px 0 0; white-space: pre-wrap; word-break: break-word;
    color: var(--muted); font-family: var(--sans); font-size: 12.5px; line-height: 1.7;
  }

  .tool {
    margin-top: 10px;
    border: 1px solid var(--line-soft);
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
  }
  .tool-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 11px;
    border-bottom: 1px solid var(--line-soft);
    font-size: 12px; color: var(--muted);
  }
  .tool-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--warm); }
  .tool-dot.ok { background: var(--accent); }
  .tool-dot.bad { background: var(--danger); }
  .tool-cmd { font-family: var(--mono); font-size: 11.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool pre {
    margin: 0; padding: 10px 11px; max-height: 220px; overflow: auto;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55;
    color: var(--muted); white-space: pre-wrap; word-break: break-word;
  }
  .tool pre:empty { display: none; }

  .file {
    margin-top: 10px; border: 1px solid var(--line-soft); background: var(--card);
    border-radius: 12px; padding: 9px 11px; font-size: 12px; color: var(--muted);
  }
  .file b { color: var(--ink); font-weight: 500; }
  .file .kind { color: var(--accent); font-family: var(--mono); font-size: 11px; margin-left: 6px; }

  .usage { margin-top: 8px; font-size: 11px; color: var(--muted-2); font-family: var(--mono); }
  .error-card {
    margin-top: 10px; border: 1px solid rgba(224, 138, 134, .3);
    background: rgba(224, 138, 134, .07); color: #efb3af;
    border-radius: 12px; padding: 9px 11px; font-size: 12.5px; white-space: pre-wrap;
  }

  .composer {
    padding: 10px 12px 9px;
    background: color-mix(in srgb, var(--surface) 86%, transparent);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
  }
  .inputWrap { display: flex; align-items: flex-end; gap: 10px; }
  textarea {
    flex: 1; resize: none; border: 0; outline: none; background: transparent;
    color: var(--ink); font-family: var(--sans); font-size: 14.5px; line-height: 1.6;
    min-height: 44px; max-height: 180px; padding: 8px 6px;
  }
  textarea::placeholder { color: var(--muted-2); }
  #send {
    background: linear-gradient(135deg, var(--accent-strong), var(--accent));
    color: var(--accent-ink); border: 0; font-weight: 700;
    min-width: 72px; padding: 11px 16px;
  }
  #send:hover { filter: brightness(1.05); }
  .hint { margin-top: 6px; padding-left: 6px; font-size: 11px; color: var(--muted-2); display: flex; gap: 10px; flex-wrap: wrap; }
  .hint #threadLabel { font-family: var(--mono); color: var(--muted); }

  @media (max-width: 820px) {
    .app { padding: 10px 10px 8px; gap: 10px; }
    .top { flex-wrap: wrap; gap: 10px; padding: 10px 12px; }
    .brand { min-width: 0; }
    .project { order: 3; flex-basis: 100%; }
    .actions { margin-left: auto; }
    .bubble { max-width: 88%; }
    .msg { gap: 8px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark">P</div>
      <div>
        <div class="name">Personal Agent</div>
        <div class="sub">local · memory · deepseek</div>
      </div>
    </div>
    <div class="project">
      <label for="cwd">项目文件夹</label>
      <input id="cwd" spellcheck="false" autocomplete="off" />
    </div>
    <div class="actions">
      <span id="status" class="status" data-tone="ok">就绪</span>
      <button id="newChat" type="button">新对话</button>
    </div>
  </header>

  <main id="chat" class="chat">
    <section id="empty" class="empty">
      <h1>今天想做什么？</h1>
      <p>从一个问题开始。它会在这个对话里调用工具、读文件、跑命令，并把结果留在同一个工作台里。</p>
      <div class="chips">
        <button class="chip" data-prompt="讲讲电压到底是什么，用图解释。">讲讲电压</button>
        <button class="chip" data-prompt="看一下这个仓库，告诉我它怎么组织。">看仓库</button>
        <button class="chip" data-prompt="帮我规划今天的学习，先测一下我卡在哪。">规划学习</button>
      </div>
    </section>
  </main>

  <footer class="composer">
    <div class="inputWrap">
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button id="send" type="button">发送</button>
    </div>
    <div class="hint">
      <span>Enter 发送 · Shift+Enter 换行</span>
      <span>会话 <span id="threadLabel">新会话</span></span>
    </div>
  </footer>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const chat = $("chat");
  const empty = $("empty");
  const input = $("input");
  const sendBtn = $("send");
  const statusEl = $("status");
  const cwdEl = $("cwd");
  const threadLabel = $("threadLabel");
  const newChatBtn = $("newChat");

  const state = {
    threadId: null,
    busy: false,
    turn: null,
    cwd: localStorage.getItem("pa.cwd") || "C:\\personal agent",
  };

  cwdEl.value = state.cwd;

  function setStatus(text, tone = "ok") {
    statusEl.textContent = text;
    statusEl.dataset.tone = tone;
  }

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function hideEmpty() {
    if (empty && empty.parentElement) empty.remove();
  }

  function shortId(id) {
    if (!id) return "新会话";
    return id.length > 14 ? id.slice(0, 8) + "…" + id.slice(-4) : id;
  }

  function addUser(text) {
    hideEmpty();
    const row = document.createElement("div");
    row.className = "msg user";
    row.innerHTML = '<div class="avatar">你</div><div class="bubble"></div>';
    row.querySelector(".bubble").textContent = text;
    chat.appendChild(row);
    scrollToBottom();
  }

  function addAssistantTurn() {
    hideEmpty();
    const row = document.createElement("div");
    row.className = "msg assistant";
    row.innerHTML = '<div class="avatar">P</div><div class="bubble"><div class="typing">思考中…</div><div class="items"></div><div class="usage"></div></div>';
    chat.appendChild(row);
    scrollToBottom();
    const turn = {
      row,
      bubble: row.querySelector(".bubble"),
      items: row.querySelector(".items"),
      typing: row.querySelector(".typing"),
      usage: row.querySelector(".usage"),
      nodes: new Map(),
      errors: 0,
    };
    state.turn = turn;
    return turn;
  }

  function ensureTurn() {
    if (!state.turn || state.turn.row.dataset.done === "1") return addAssistantTurn();
    return state.turn;
  }

  function setTyping(turn, text) {
    if (!turn.typing) return;
    if (text) { turn.typing.textContent = text; turn.typing.style.display = ""; }
    else turn.typing.style.display = "none";
  }

  function nodeFor(turn, id, className) {
    if (!id) id = "anon-" + Math.random().toString(36).slice(2);
    let node = turn.nodes.get(id);
    if (!node) {
      node = document.createElement("div");
      node.className = className;
      turn.items.appendChild(node);
      turn.nodes.set(id, node);
    }
    return node;
  }

  function renderAgentMessage(turn, item) {
    setTyping(turn, null);
    const node = nodeFor(turn, item.id, "agent-text");
    node.textContent = item.text || "";
    scrollToBottom();
  }

  function renderReasoning(turn, item) {
    const text = (item.text || "").trim();
    if (!text) return;
    let node = turn.nodes.get(item.id);
    if (!node) {
      node = document.createElement("details");
      node.className = "reasoning";
      node.open = false;
      node.innerHTML = "<summary>思考过程</summary><pre></pre>";
      turn.items.appendChild(node);
      turn.nodes.set(item.id, node);
    }
    node.querySelector("pre").textContent = text;
  }

  function renderTool(turn, item) {
    const id = item.id || "tool-" + Math.random().toString(36).slice(2);
    let node = turn.nodes.get(id);
    if (!node) {
      node = document.createElement("div");
      node.className = "tool";
      node.innerHTML = '<div class="tool-head"><span class="tool-dot"></span><span class="tool-cmd"></span></div><pre></pre>';
      turn.items.appendChild(node);
      turn.nodes.set(id, node);
    }
    const dot = node.querySelector(".tool-dot");
    const cmd = node.querySelector(".tool-cmd");
    const out = node.querySelector("pre");
    const status = item.status || "";
    dot.className = "tool-dot" + (status === "completed" ? " ok" : status === "failed" || status === "declined" ? " bad" : "");
    cmd.textContent = item.command || item.name || "tool";
    out.textContent = item.aggregated_output || item.output || "";
    scrollToBottom();
  }

  function renderFileChange(turn, item) {
    const id = item.id || "file-" + Math.random().toString(36).slice(2);
    let node = turn.nodes.get(id);
    if (!node) {
      node = document.createElement("div");
      node.className = "file";
      turn.items.appendChild(node);
      turn.nodes.set(id, node);
    }
    const changes = Array.isArray(item.changes) ? item.changes : [];
    node.textContent = "";
    for (const change of changes) {
      const line = document.createElement("div");
      line.innerHTML = "<b></b><span class='kind'></span>";
      line.querySelector("b").textContent = change.path || "(unknown)";
      line.querySelector(".kind").textContent = change.kind || "";
      node.appendChild(line);
    }
    if (!changes.length) node.textContent = "文件已变更";
    scrollToBottom();
  }

  function renderTodo(turn, item) {
    const id = item.id || "todo-" + Math.random().toString(36).slice(2);
    let node = turn.nodes.get(id);
    if (!node) {
      node = document.createElement("div");
      node.className = "file";
      turn.items.appendChild(node);
      turn.nodes.set(id, node);
    }
    const items = Array.isArray(item.items) ? item.items : [];
    node.textContent = "";
    for (const todo of items) {
      const line = document.createElement("div");
      line.textContent = (todo.completed ? "✓ " : "○ ") + (todo.text || "");
      node.appendChild(line);
    }
  }

  function addError(turn, message) {
    const node = document.createElement("div");
    node.className = "error-card";
    node.textContent = message;
    (turn ? turn.items : chat).appendChild(node);
    if (turn) turn.errors += 1;
    scrollToBottom();
  }

  function renderItem(turn, item) {
    if (!item || !item.type) return;
    switch (item.type) {
      case "agent_message": renderAgentMessage(turn, item); break;
      case "reasoning": renderReasoning(turn, item); break;
      case "command_execution": renderTool(turn, item); break;
      case "file_change": renderFileChange(turn, item); break;
      case "mcp_tool_call": renderTool(turn, { ...item, command: item.tool || item.name || "mcp" }); break;
      case "web_search": renderTool(turn, { ...item, command: "web_search", aggregated_output: item.query || "" }); break;
      case "todo_list": renderTodo(turn, item); break;
      case "error": addError(turn, item.message || "未知错误"); break;
    }
  }

  function handleEvent(event) {
    const turn = state.turn || null;
    switch (event.type) {
      case "thread.started":
        state.threadId = event.thread_id;
        threadLabel.textContent = shortId(state.threadId);
        break;
      case "turn.started":
        setStatus("运行中", "busy");
        if (turn) setTyping(turn, "思考中…");
        break;
      case "item.started":
      case "item.updated":
      case "item.completed":
        if (turn) renderItem(turn, event.item);
        break;
      case "turn.completed": {
        if (turn) {
          setTyping(turn, null);
          const u = event.usage || {};
          turn.usage.textContent = `tokens ${u.input_tokens || 0} in · ${u.output_tokens || 0} out · ${u.reasoning_output_tokens || 0} reasoning`;
          turn.row.dataset.done = "1";
        }
        setStatus("就绪", "ok");
        break;
      }
      case "turn.failed":
        addError(turn, event.error && event.error.message ? event.error.message : "本轮失败");
        if (turn) turn.row.dataset.done = "1";
        setStatus("失败", "error");
        break;
      case "error":
        addError(turn, event.message || "错误");
        setStatus("失败", "error");
        break;
      case "stderr":
        if (!turn || turn.errors === 0) {
          // Keep stderr visible only when it looks like a real failure.
          if (/error|panic|failed|denied/i.test(event.message || "")) addError(turn, event.message);
        }
        break;
      case "process.exit":
        if (turn) turn.row.dataset.done = "1";
        if (event.code !== 0 && state.busy) {
          addError(turn, `agent 进程退出，code=${event.code}`);
          setStatus("失败", "error");
        }
        finishTurn();
        break;
    }
  }

  function finishTurn() {
    state.busy = false;
    sendBtn.disabled = false;
    setTyping(state.turn, null);
    scrollToBottom();
  }

  async function send(prompt) {
    const text = (prompt ?? input.value).trim();
    if (!text || state.busy) return;
    state.cwd = cwdEl.value.trim() || state.cwd;
    localStorage.setItem("pa.cwd", state.cwd);

    addUser(text);
    input.value = "";
    resizeInput();
    state.busy = true;
    sendBtn.disabled = true;
    setStatus("启动 agent…", "busy");
    addAssistantTurn();

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt: text,
          thread_id: state.threadId,
          cwd: state.cwd,
        }),
      });
      if (!response.ok) {
        const raw = await response.text();
        addError(state.turn, raw || `HTTP ${response.status}`);
        setStatus("失败", "error");
        finishTurn();
        return;
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let index;
        while ((index = buffer.indexOf("\n\n")) >= 0) {
          const block = buffer.slice(0, index);
          buffer = buffer.slice(index + 2);
          const data = block
            .split("\n")
            .filter((line) => line.startsWith("data:"))
            .map((line) => line.slice(5).trim())
            .join("\n");
          if (!data) continue;
          try { handleEvent(JSON.parse(data)); } catch { /* ignore non-JSON */ }
        }
      }
      finishTurn();
      if (statusEl.dataset.tone !== "error") setStatus("就绪", "ok");
    } catch (error) {
      addError(state.turn, String(error));
      setStatus("失败", "error");
      finishTurn();
    }
  }

  function resizeInput() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  }

  function newChat() {
    if (state.busy) return;
    state.threadId = null;
    state.turn = null;
    threadLabel.textContent = "新会话";
    chat.innerHTML = "";
    const section = document.createElement("section");
    section.id = "empty";
    section.className = "empty";
    section.innerHTML = `
      <h1>今天想做什么？</h1>
      <p>从一个问题开始。它会在这个对话里调用工具、读文件、跑命令，并把结果留在同一个工作台里。</p>
      <div class="chips">
        <button class="chip" data-prompt="讲讲电压到底是什么，用图解释。">讲讲电压</button>
        <button class="chip" data-prompt="看一下这个仓库，告诉我它怎么组织。">看仓库</button>
        <button class="chip" data-prompt="帮我规划今天的学习，先测一下我卡在哪。">规划学习</button>
      </div>`;
    chat.appendChild(section);
    bindChips();
    setStatus("就绪", "ok");
    input.focus();
  }

  function bindChips() {
    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => send(chip.dataset.prompt || chip.textContent));
    });
  }

  sendBtn.addEventListener("click", () => send());
  newChatBtn.addEventListener("click", newChat);
  input.addEventListener("input", resizeInput);
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      send();
    }
  });
  cwdEl.addEventListener("change", () => {
    state.cwd = cwdEl.value.trim();
    localStorage.setItem("pa.cwd", state.cwd);
  });

  bindChips();
  resizeInput();
  input.focus();
</script>
</body>
</html>
